server:
  port: 8080
spring:
  application:
    name: ww-job-admin
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  datasource:
    url: jdbc:mysql://localhost:3306/ww_job?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 默认使用 docker-compose 提供的 MySQL（root/root）；本机密码不同时，
    # 在 application-local.yml 中覆盖（该文件已被 .gitignore 忽略，不入库）
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.qq.com
    port: 465
    username: your-email@qq.com   # 真实邮箱在 application-local.yml 覆盖
    properties:
      mail.smtp.ssl.enable: true
    # password（SMTP 授权码）在 application-local.yml 覆盖，不入库
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
wwjob:
  auth:
    jwt-secret: wwjob-dev-secret-please-override-2026   # 开发默认，生产在 application-local.yml 覆盖
    jwt-expire-seconds: 86400                            # token 有效期 24h

